name: Auto PR for Claude branches

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          # Check if PR already exists for this branch
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)

          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already exists for branch $BRANCH — skipping."
            exit 0
          fi

          TITLE=$(git log -1 --format='%s')
          COMMITS=$(git log origin/main..HEAD --format='- %s' 2>/dev/null || echo "- $TITLE")

          gh pr create \
            --title "$TITLE" \
            --body "## Summary
          Auto-generated PR from Claude Code branch.

          ### Commits
          ${COMMITS}" \
            --base main \
            --head "$BRANCH" || echo "PR creation failed or already exists"
