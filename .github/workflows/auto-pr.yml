name: Auto PR for Claude branches

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for existing PR
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          PR_NUMBER=$(gh pr list --head "$BRANCH" --state open --json number --jq 'if length > 0 then .[0].number else "" end')
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          if [ -n "$PR_NUMBER" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "PR #$PR_NUMBER already exists for $BRANCH"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No PR found for $BRANCH — will create one"
          fi

      - name: Create Pull Request
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ steps.check.outputs.branch }}"
          TITLE=$(git log -1 --format='%s')
          COMMITS=$(git log origin/main..HEAD --format='- %s')

          gh pr create \
            --title "$TITLE" \
            --body "## Summary
          Auto-generated PR from Claude Code branch.

          ### Commits
          ${COMMITS}" \
            --base main \
            --head "$BRANCH"

          echo "PR created for $BRANCH"
