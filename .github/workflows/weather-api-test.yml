name: Weather API Smoke Test

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'src/app/api/weather/**'
      - 'src/lib/**'
      - 'package.json'
      - 'vitest.config.ts'
  pull_request:
    branches:
      - main
    paths:
      - 'src/app/api/weather/**'
      - 'src/lib/**'
      - 'package.json'
      - 'vitest.config.ts'

jobs:
  weather-api-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run weather API smoke test
        run: npm test -- --run src/app/api/weather/route.test.ts
